# Build our patched KiCad for Linux, macOS (arm64) and Windows, and publish
# the packages on the GitHub release for a tag.
#
# Triggers:
#   * pushing a tag  v<kicad version><letter>   e.g. v10.0.5a  -> builds + release
#   * workflow_dispatch                          -> builds only (dev snapshot)
#
# Nothing runs on ordinary pushes: a full KiCad build is hours of runner time
# per platform (macOS runners bill at 10x on private repos), so it is opt-in.
#
# Sources: upstream KiCad and kicad-mac-builder at the refs pinned in
# upstream.env, with patches/ applied (scripts/bootstrap.sh) -- exactly what
# the local dev tree in this repo is.

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Homebrew/vcpkg/pip: no analytics, no interactive prompts.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  meta:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "is_release=true" >> "$GITHUB_OUTPUT"; else echo "is_release=false" >> "$GITHUB_OUTPUT"; fi
          echo "Building KiCad $version"

  linux:
    name: linux x86_64
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache pkg-config git \
            libbz2-dev libcairo2-dev libglu1-mesa-dev libgl1-mesa-dev libglew-dev libx11-dev \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev mesa-common-dev libssl-dev libzstd-dev \
            python3-dev python3-wxgtk4.0 swig libgit2-dev libsecret-1-dev libboost-all-dev \
            libglm-dev libcurl4-openssl-dev libgtk-3-dev libngspice0-dev ngspice-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-data-exchange-dev \
            libocct-visualization-dev libocct-foundation-dev libocct-ocaf-dev \
            unixodbc-dev libnng-dev libprotobuf-dev protobuf-compiler zlib1g-dev \
            libharfbuzz-dev libzint-dev libpoppler-dev libpoppler-glib-dev shared-mime-info

      - name: Check out patched KiCad
        run: SHALLOW=1 VERSION_TAG="$VERSION" scripts/bootstrap.sh kicad

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('upstream.env', 'patches/kicad/*') }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ hashFiles('upstream.env', 'patches/kicad/*') }}-
            ccache-linux-

      - name: Configure
        run: |
          cmake -S kicad -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/kicad-custom \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKICAD_SCRIPTING_WXPYTHON=ON \
            -DKICAD_BUILD_I18N=OFF \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_USE_SENTRY=OFF \
            -DKICAD_INSTALL_DEMOS=OFF

      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel "$(nproc)"
          ccache -s

      - name: Package
        run: |
          DESTDIR="$PWD/dist" cmake --install build >/dev/null
          cat > dist/opt/kicad-custom/README-INSTALL.txt <<'TXT'
          KiCad (custom build) for Linux x86_64 -- built on Ubuntu 24.04.

          Install:   sudo tar --zstd -xf kicad-*-linux-x86_64.tar.zst -C /
          Run:       /opt/kicad-custom/bin/kicad

          Runtime packages (Ubuntu 24.04): libwxgtk3.2-1t64 libwxgtk-webview3.2-1t64
          libocct-* libngspice0 libnng1 libprotobuf32t64 libgit2-1.7 libglew2.2 libcairo2
          libcurl4 libsecret-1-0 libzint2.12 python3 python3-wxgtk4.0
          Symbol/footprint libraries are not included; point KICAD10_SYMBOL_DIR etc.
          at an existing KiCad 10 library install (Preferences > Configure Paths).
          TXT
          tar --zstd -cf "kicad-$VERSION-linux-x86_64.tar.zst" -C dist opt
          ls -la kicad-*.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: kicad-*-linux-x86_64.tar.zst
          if-no-files-found: error

  macos:
    name: macos arm64
    needs: meta
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MACOS_MIN: "13.0"
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew dependencies
        run: |
          # kicad-mac-builder's own list (ci/src/brew_deps.sh) plus ccache.
          brew install glew bison opencascade glm boost harfbuzz cairo doxygen gettext wget \
            libgit2 libtool autoconf automake cmake openssl unixodbc ninja protobuf nng zstd \
            libomp jpeg ccache swig
          # bison must be Homebrew's; the builder expects it on PATH.
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Check out patched KiCad and kicad-mac-builder
        run: SHALLOW=1 VERSION_TAG="$VERSION" scripts/bootstrap.sh

      - name: Cache built dependencies (wxWidgets, Python, wxPython, ngspice)
        uses: actions/cache@v4
        with:
          path: |
            kicad-mac-builder/build/wxwidgets
            kicad-mac-builder/build/wxwidgets-dest
            kicad-mac-builder/build/python
            kicad-mac-builder/build/python-dest
            kicad-mac-builder/build/wxpython-prefix
            kicad-mac-builder/build/ngspice
            kicad-mac-builder/build/ngspice-dest
          key: kmb-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.MACOS_MIN }}-${{ hashFiles('upstream.env', 'patches/kicad-mac-builder/*') }}-v1

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ hashFiles('upstream.env', 'patches/kicad/*') }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos-${{ hashFiles('upstream.env', 'patches/kicad/*') }}-
            ccache-macos-

      - name: Build dependencies, KiCad and the DMG
        working-directory: kicad-mac-builder
        run: |
          source ../upstream.env
          ccache -z || true
          WX_SKIP_DOXYGEN_VERSION_CHECK=1 ./build.py --arch arm64 \
            --kicad-source-dir "$PWD/../kicad" \
            --macos-min-version "$MACOS_MIN" \
            --build-type Release \
            --symbols-ref "$LIB_REF" --footprints-ref "$LIB_REF" \
            --templates-ref "$LIB_REF" --packages3d-ref "$LIB_REF" \
            --release-name "kicad-$VERSION" \
            --extra-kicad-cmake-args "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DKICAD_USE_SENTRY=OFF" \
            --target package-kicad-nightly
          ccache -s || true
          ls -la build/dmg/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: kicad-mac-builder/build/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: windows x64
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;default,readwrite
      VCPKG_MAX_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Check out patched KiCad
        shell: bash
        run: SHALLOW=1 VERSION_TAG="$VERSION" scripts/bootstrap.sh kicad

      - name: Read the vcpkg baseline KiCad pins
        id: vcpkg
        shell: bash
        run: |
          baseline="$(python3 -c "import json;print(json.load(open('kicad/vcpkg-configuration.json'))['default-registry']['baseline'])")"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "manifest=$(sha256sum kicad/vcpkg.json kicad/vcpkg-configuration.json | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The dependency set (OCCT, wxWidgets, Boost, Python, wxPython, ...) is
      # hours of compile on a 4-core runner. vcpkg's binary cache is stored
      # per port, and saved even if the job times out, so a first run that
      # does not finish still leaves the next one most of the way there.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-win-x64-${{ steps.vcpkg.outputs.baseline }}-${{ steps.vcpkg.outputs.manifest }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-win-x64-${{ steps.vcpkg.outputs.baseline }}-${{ steps.vcpkg.outputs.manifest }}-
            vcpkg-win-x64-${{ steps.vcpkg.outputs.baseline }}-

      - name: Set up vcpkg at KiCad's baseline
        shell: pwsh
        run: |
          git clone -q https://github.com/microsoft/vcpkg.git C:\vcpkg
          git -C C:\vcpkg checkout -q ${{ steps.vcpkg.outputs.baseline }}
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force -Path C:\vcpkg-cache | Out-Null

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (installs vcpkg dependencies)
        shell: pwsh
        run: |
          cmake -S kicad -B C:\kicad-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/kicad/tools/custom_vcpkg_triplets" `
            -DVCPKG_INSTALL_OPTIONS="--clean-after-build;--x-abi-tools-use-exact-versions" `
            -DCMAKE_INSTALL_PREFIX=C:\kicad-out `
            -DKICAD_SCRIPTING_WXPYTHON=ON `
            -DKICAD_USE_OCC=ON `
            -DKICAD_BUILD_I18N=OFF `
            -DKICAD_BUILD_QA_TESTS=OFF `
            -DKICAD_USE_SENTRY=OFF `
            -DKICAD_INSTALL_DEMOS=OFF `
            -DKICAD_WIN32_DPI_AWARE=ON

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        shell: pwsh
        run: cmake --build C:\kicad-build --parallel 4

      - name: Install and assemble the runtime tree
        shell: pwsh
        run: |
          cmake --install C:\kicad-build | Out-Null
          $vcpkg = "C:\kicad-build\vcpkg_installed\x64-windows"
          $out = "C:\kicad-out"
          # Same assembly kicad-win-builder does: dependency DLLs, ngspice code
          # models, locale data, and vcpkg's Python (KiCad's plugin venvs need it).
          Copy-Item "$vcpkg\bin\*.dll" -Destination "$out\bin" -Force
          if (Test-Path "$vcpkg\etc")            { Copy-Item "$vcpkg\etc" -Destination "$out\etc" -Recurse -Force }
          if (Test-Path "$vcpkg\lib\ngspice")    { New-Item -ItemType Directory -Force -Path "$out\lib" | Out-Null; Copy-Item "$vcpkg\lib\ngspice" -Destination "$out\lib\ngspice" -Recurse -Force }
          if (Test-Path "$vcpkg\share\locale")   { New-Item -ItemType Directory -Force -Path "$out\share" | Out-Null; Copy-Item "$vcpkg\share\locale" -Destination "$out\share\locale" -Recurse -Force }
          if (Test-Path "$vcpkg\tools\python3") {
            Copy-Item "$vcpkg\tools\python3\*" -Destination "$out\bin" -Recurse -Force
            Remove-Item "$out\bin\Scripts" -Recurse -Force -ErrorAction SilentlyContinue
            & "$out\bin\python.exe" -m ensurepip --upgrade
          }
          Set-Content -Path "$out\README-INSTALL.txt" -Value @"
          KiCad (custom build) for Windows x64 -- portable tree, no installer.

          Unzip anywhere and run bin\kicad.exe. Symbol/footprint libraries are not
          included; point KICAD10_SYMBOL_DIR etc. at an existing KiCad 10 install
          (Preferences > Configure Paths). Settings live in %APPDATA%\kicad\10.0 and
          are shared with an installed KiCad 10.
          "@
          Compress-Archive -Path "$out\*" -DestinationPath "kicad-$env:VERSION-windows-x64.zip" -CompressionLevel Optimal
          Get-Item kicad-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: kicad-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: [meta, linux, macos, windows]
    if: needs.meta.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        run: |
          source upstream.env
          {
            echo "KiCad **$VERSION**: upstream KiCad \`$KICAD_REF\` plus this repository's patches."
            echo
            echo "### Patches"
            for p in patches/kicad/*.patch; do
              echo "- \`$(basename "$p")\` — $(sed -n 's/^Subject: \[PATCH[^]]*\] //p' "$p" | head -1)"
            done
            echo
            echo "### Downloads"
            echo "- macOS (Apple Silicon): the \`.dmg\` — drag KiCad to Applications; unsigned, so right-click > Open the first time."
            echo "- Windows x64: the \`.zip\` — a portable tree, unzip and run \`bin\\kicad.exe\` (see README-INSTALL.txt inside)."
            echo "- Linux x86_64: the \`.tar.zst\` — built on Ubuntu 24.04, installs to \`/opt/kicad-custom\` (see README-INSTALL.txt inside)."
            echo
            echo "Symbol/footprint libraries are not bundled in the Windows and Linux packages; use an existing KiCad 10 library install."
          } > notes.md
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "KiCad $VERSION (custom)" --notes-file notes.md
